[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-lsp"
version = "0.2.9"
description = "A standalone LSP command line client for agent workflows"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
codex-lsp = "codex_lsp.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
codex_lsp = ["defaults.json"]

[tool.setuptools.packages.find]
where = ["src"]
